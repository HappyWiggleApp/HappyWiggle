[package]
name = "happywiggle"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Geordy"]
description = "Free, open-source mouse wiggler and auto clicker."
rust-version = "1.90"

[lib]
name = "happywiggle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Build for the Mac App Store: sandbox-friendly, launch-at-login through the system login-item service,
# no external donation link (Apple wants tips to go through in-app purchase).
mas = []
# Build for the Microsoft Store (MSIX): launch-at-login is handled by the
# package manifest rather than the registry.
msstore = []

[dependencies]
wiggler-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keepawake = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_SystemInformation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
# login item for the sandboxed Mac App Store build (macOS 13+)
smappservice-rs = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
enigo = "0.6"
