# Push a tag like v0.1.0 and this builds everything and prepares a draft
# release on GitHub with:
#   - the Windows installer (.exe) and the macOS disk image (.dmg) for direct download
#   - the .msix package to upload to the Microsoft Store (Microsoft signs it)
# The Mac App Store package needs Apple certificates; see packaging/macos.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Installer for direct download
        run: npx tauri build
      - name: Keep the direct-download installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe out/
      # The next two steps run once the three MSSTORE_* repository variables
      # exist (roadmap, stage 9). Until then the release simply has no .msix.
      - name: Microsoft Store build (no bundling)
        if: ${{ vars.MSSTORE_IDENTITY_NAME != '' }}
        run: npx tauri build --no-bundle --features msstore
      - name: Pack the MSIX
        if: ${{ vars.MSSTORE_IDENTITY_NAME != '' }}
        shell: pwsh
        run: >
          ./packaging/windows/make-msix.ps1
          -IdentityName "${{ vars.MSSTORE_IDENTITY_NAME }}"
          -Publisher "${{ vars.MSSTORE_PUBLISHER }}"
          -PublisherDisplayName "${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}"
          -OutDir out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    env:
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # Without Apple secrets the app is built unsigned, and macOS warns when
      # it is opened. With them (roadmap, stage 10, fallback) the disk image
      # is signed and notarised.
      - name: Disk image for direct download (unsigned)
        if: env.HAS_APPLE != 'true'
        run: npx tauri build --target universal-apple-darwin
      - name: Disk image for direct download (signed and notarised)
        if: env.HAS_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: files/*
