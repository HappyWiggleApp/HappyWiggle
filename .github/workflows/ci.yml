# Runs on every push and pull request:
#   1. the engine's automated tests and the interface walkthrough (Linux)
#   2. a real build of the app on Windows, macOS and Linux
# The installers it produces can be downloaded from the run's "Artifacts".
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Engine tests
        run: cargo test -p wiggler-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Interface walkthrough
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python tools/make-preview.py
          python tools/ui-check.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: "" }
          - { os: macos-latest, args: "--target universal-apple-darwin" }
          - { os: ubuntu-24.04, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build installers
        run: npx tauri build ${{ matrix.args }}
      # Start the real app on this machine and wait for its window to report
      # that the interface loaded. Catches "it builds but the window is empty".
      - name: Start-up test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:HAPPYWIGGLE_SELFTEST = Join-Path $env:RUNNER_TEMP "selftest"
          $app = Start-Process -FilePath "target\release\happywiggle.exe" -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            if (Test-Path (Join-Path $env:HAPPYWIGGLE_SELFTEST "main.txt")) { $ok = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          if (-not $ok) { throw "The main window never finished loading its interface." }
          Write-Host "The main window loaded its interface."
      - name: Start-up test (macOS and Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          export HAPPYWIGGLE_SELFTEST="$RUNNER_TEMP/selftest"
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            target/universal-apple-darwin/release/happywiggle &
          else
            sudo apt-get install -y xvfb dbus-x11 >/dev/null
            dbus-run-session -- xvfb-run -a target/release/happywiggle &
          fi
          ok=no
          for i in $(seq 1 60); do
            if [ -f "$HAPPYWIGGLE_SELFTEST/main.txt" ]; then ok=yes; break; fi
            sleep 1
          done
          pkill -x happywiggle || true
          if [ "$ok" != yes ]; then echo "The main window never finished loading its interface."; exit 1; fi
          echo "The main window loaded its interface."
      # The store variants contain a little code of their own: make sure it compiles too.
      - name: Check the Microsoft Store variant
        if: matrix.os == 'windows-latest'
        run: cargo check -p happywiggle --features msstore
      - name: Check the Mac App Store variant
        if: matrix.os == 'macos-latest'
        run: cargo check -p happywiggle --features mas
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
